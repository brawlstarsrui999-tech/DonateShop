name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          set +e
          mvn -B clean package 2>&1 | tee mvn.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # продублировать ошибки компиляции в аннотации прогона (видны через API)
            grep -E "\[ERROR\]|BUILD FAILURE" mvn.log | head -60 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::$esc"
            done
          fi
          exit "$code"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: DonateShop
          path: target/DonateShop-*.jar
